name: Windows 11 (ARM) + Tailscale

on:
  workflow_dispatch:

jobs:
  win11:
    runs-on: windows-11-arm

    steps:
      - name: Connect to Tailscale
        uses: celsiusnarhwal/tailnet-link@v1
        with:
          authkey: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set RDP password
        shell: pwsh
        run: net user Administrator "${{ secrets.RDP_PASSWORD }}"

      - name: Enable RDP & keep alive
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          New-NetFirewallRule -Name "Allow RDP" -DisplayName "Allow RDP" -Protocol TCP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue

          $tsIp = (tailscale ip -4)
          Write-Host "RDP to: $tsIp (port 3389)"
          Write-Host "User: Administrator  Pass: $env:RDP_PASSWORD"

          Write-Host "Keeping alive for 6 hours..."
          Start-Sleep -Seconds 21600   
